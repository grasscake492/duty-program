<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游客端 - 图片社系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #ccc3e2 100%); color: #333; line-height: 1.6; padding: 20px; min-height: 100vh; }
        .container { max-width: 980px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        h2 { color: #2c3e50; margin-bottom: 18px; }
        .description { color: #7f8c8d; max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 10px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .tabs { display: flex; margin-bottom: 25px; background: rgba(255,255,255,0.5); padding: 5px; border-radius: 10px; }
        .tab { flex: 1; padding: 14px; text-align: center; cursor: pointer; border-radius: 8px; font-weight: 600; color: #555; transition: all 0.3s; margin: 0 5px; }
        .tab:hover { background: rgba(255,255,255,0.8); color: #3498db; }
        .tab.active { background: #3498db; color: white; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }
        .tab-content { display: none; animation: fadeIn 0.35s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #2c3e50; }
        input, select, textarea { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; transition: border-color 0.3s; outline: none; background: white; }
        input:focus, select:focus, textarea:focus { border-color: #3498db; }
        textarea { min-height: 82px; resize: vertical; }
        button { background: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: background 0.3s, transform 0.2s; }
        button:hover { background: #2980b9; transform: translateY(-2px); }
        button:disabled { background: #bdc3c7; cursor: not-allowed; transform: none; }
        .full-btn { width: 100%; }
        .ghost-btn { background: #95a5a6; }
        .ghost-btn:hover { background: #7f8c8d; }
        .danger-btn { background: #e74c3c; }
        .danger-btn:hover { background: #c0392b; }
        .schedule-grid { display: grid; grid-template-columns: 80px repeat(5, 1fr); gap: 8px; margin-top: 20px; }
        .time-slot { background: #34495e; color: white; padding: 10px 5px; text-align: center; border-radius: 4px; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .day-header { background: #2c3e50; color: white; padding: 10px 5px; text-align: center; border-radius: 4px; font-weight: 600; font-size: 14px; }
        .schedule-cell { background: #ecf0f1; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; transition: all 0.2s ease; font-weight: 500; user-select: none; font-size: 13px; color: #7f8c8d; }
        .schedule-cell:hover { background: #dfe6e9; }
        .schedule-cell.selected { background: #2ecc71; color: white; font-weight: bold; box-shadow: 0 2px 8px rgba(46, 204, 113, 0.4); transform: scale(1.05); }
        .role-options { display: flex; gap: 20px; margin-top: 10px; }
        .role-option { display: flex; align-items: center; gap: 6px; padding: 10px 15px; border: 2px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: 600; background: #f8f9fa; flex: 1; justify-content: center; }
        .role-option:hover { border-color: #3498db; }
        .role-option input[type="radio"] { width: auto; transform: scale(1.2); }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .item-row { display: grid; grid-template-columns: 180px minmax(0, 1fr) 120px 100px; gap: 14px; align-items: start; margin-bottom: 14px; }
        .item-row select, .item-row input, .item-row button { height: 54px; }
        .item-row button { width: 100%; padding: 0 16px; }
        .stock-note { margin-top: 8px; color: #7f8c8d; font-size: 13px; min-height: 20px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 18px; }
        .inventory-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .inventory-card { border: 1px solid #eef0f2; border-radius: 8px; padding: 14px; background: #fbfcfd; }
        .query-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: end; margin-bottom: 18px; }
        .badge { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #d5f5e3; color: #27ae60; }
        .badge.maintenance { background: #fdebd0; color: #d35400; }
        .status-message { margin-top: 15px; padding: 10px; border-radius: 5px; background: #f8f9fa; border-left: 4px solid #bdc3c7; display: none; }
        #loan-message { white-space: pre-line; }
        .status-message.error { border-left-color: #e74c3c; background: #fadbd8; display: block; color: #c0392b; }
        .status-message.success { border-left-color: #2ecc71; background: #d5f5e3; display: block; color: #27ae60; }
        .status-message.warning, .status-message.loading { border-left-color: #f39c12; background: #fff3cd; display: block; color: #9a6500; }
        @media (max-width: 768px) {
            .tabs, .toolbar { flex-direction: column; }
            .tab, .toolbar button { width: 100%; }
            .schedule-grid { grid-template-columns: 60px repeat(5, 1fr); gap: 4px; }
            .time-slot, .day-header, .schedule-cell { font-size: 12px; height: 50px; padding: 2px; }
            .form-grid, .item-row, .query-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>图片社自助系统</h1>
        <p class="description" id="week-info">正在连接服务器获取教学周信息...</p>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('schedule-tab')">1. 填写排班</div>
        <div class="tab" onclick="switchTab('loan-tab')">2. 借用设备</div>
    </div>

    <section id="schedule-tab" class="tab-content active">
        <div class="card">
            <h2>个人信息</h2>
            <div class="form-group">
                <label for="name">姓名</label>
                <input type="text" id="name" placeholder="请输入您的姓名" required>
            </div>
            <div class="form-group">
                <label for="phone">手机号码</label>
                <input type="tel" id="phone" placeholder="请输入手机号码" required>
            </div>
            <div class="form-group">
                <label>身份选择</label>
                <div class="role-options">
                    <label class="role-option"><input type="radio" name="role" value="intern"> 实习</label>
                    <label class="role-option"><input type="radio" name="role" value="senior"> 中高级</label>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>选择有空的时间</h2>
            <p style="color:#7f8c8d; font-size:0.9em;">点击格子切换选中状态，绿色为选中。</p>
            <div id="guest-schedule-container">
                <p style="text-align:center; padding:20px; color:#999;">正在加载排班计划...</p>
            </div>
            <div style="margin-top:25px;">
                <button id="submit-btn" class="full-btn" disabled>正在初始化...</button>
                <div id="status-msg" class="status-message"></div>
            </div>
        </div>
    </section>

    <section id="loan-tab" class="tab-content">
        <div class="card">
            <h2>可用设备查询</h2>
            <div class="query-row">
                <div>
                    <label for="loan-category-filter">设备分类</label>
                    <select id="loan-category-filter"></select>
                </div>
                <p class="stock-note">请选择分类后查看该类型下当前可借设备。</p>
            </div>
            <div id="loan-inventory-list" class="inventory-list"></div>
        </div>

        <form id="loan-form" class="card">
            <h2>借用申请</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="loan-borrower-name">借用人姓名</label>
                    <input type="text" id="loan-borrower-name" required placeholder="请输入姓名">
                </div>
                <div class="form-group">
                    <label for="loan-phone">联系电话</label>
                    <input type="tel" id="loan-phone" required placeholder="请输入手机号">
                </div>
                <div class="form-group">
                    <label for="loan-start-time">借用具体时间</label>
                    <input type="datetime-local" id="loan-start-time" required>
                </div>
                <div class="form-group">
                    <label for="loan-end-time">预计归还时间</label>
                    <input type="datetime-local" id="loan-end-time" required>
                </div>
                <div class="form-group">
                    <label for="loan-pickup-time">预计前往借取时间</label>
                    <input type="datetime-local" id="loan-pickup-time" required>
                    <p class="stock-note">临时密码仅 30 分钟有效，请尽量准确填写。</p>
                </div>
                <div class="form-group">
                    <label for="loan-note">备注</label>
                    <textarea id="loan-note" placeholder="可填写用途、特殊说明等"></textarea>
                </div>
            </div>

            <div class="form-group">
                <label>借用物资列表</label>
                <div class="item-row" style="margin-bottom:8px; color:#7f8c8d; font-size:13px; font-weight:700;">
                    <div>分类</div>
                    <div>具体型号</div>
                    <div>数量</div>
                    <div></div>
                </div>
                <div id="loan-item-rows"></div>
                <div class="toolbar">
                    <button type="button" class="ghost-btn" onclick="addLoanItemRow()">增加设备</button>
                    <button id="loan-submit-btn" type="submit">提交借用申请</button>
                </div>
            </div>
            <div id="loan-message" class="status-message"></div>
        </form>
    </section>
</div>

<script>
    function switchTab(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelector(`.tab[onclick="switchTab('${id}')"]`).classList.add('active');
        document.getElementById(id).classList.add('active');
    }
</script>
<script src="/js/main.js"></script>
<script>
    let loanInventory = [];
    let loanCategories = [];

    document.addEventListener('DOMContentLoaded', async () => {
        await loadLoanInventory();
        addLoanItemRow();
        document.getElementById('loan-form').addEventListener('submit', submitLoanApplication);
        ['loan-borrower-name', 'loan-phone', 'loan-start-time', 'loan-end-time', 'loan-pickup-time'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateLoanValidationSummary);
            document.getElementById(id).addEventListener('change', updateLoanValidationSummary);
        });
        document.getElementById('loan-category-filter').addEventListener('change', () => {
            renderLoanInventory();
        });
        ['loan-start-time', 'loan-end-time'].forEach(id => {
            document.getElementById(id).addEventListener('change', checkLoanConflicts);
        });
    });

    async function loadLoanInventory() {
        const res = await fetch('/api/loan/inventory');
        const result = await parseLoanApiResponse(res);
        loanInventory = result.data || [];
        renderLoanCategoryFilter();
        renderLoanInventory();
        refreshLoanRows();
    }

    function getSelectedLoanCategory() {
        const index = document.getElementById('loan-category-filter').value;
        return index === '' ? '' : loanCategories[Number(index)];
    }

    function renderLoanCategoryFilter() {
        const select = document.getElementById('loan-category-filter');
        const selected = select.value;
        loanCategories = [...new Set(loanInventory.map(item => item.category || '未分类'))];
        select.innerHTML = '<option value="">全部分类</option>' + loanCategories.map((category, index) =>
            `<option value="${index}">${escapeHtml(category)}（${loanInventory.filter(item => (item.category || '未分类') === category).length}）</option>`
        ).join('');
        if (selected !== '' && loanCategories[Number(selected)]) select.value = selected;
    }

    function renderLoanInventory() {
        const box = document.getElementById('loan-inventory-list');
        const category = getSelectedLoanCategory();
        const visibleItems = loanInventory.filter(item =>
            (!category || item.category === category) && item.availableQuantity > 0 && item.status !== '需要维修'
        );
        if (visibleItems.length === 0) {
            box.innerHTML = `<p style="color:#999;">${category ? `“${escapeHtml(category)}”分类下暂无可借设备。` : '暂无可借设备，请联系管理员维护库存。'}</p>`;
            return;
        }
        box.innerHTML = visibleItems.map(item => `
            <div class="inventory-card">
                <strong>${escapeHtml(item.name)}</strong>
                <div>${escapeHtml(item.category || '未分类')}</div>
                <div class="stock-note">总数 ${item.totalQuantity}，可用 ${item.availableQuantity}</div>
                <span class="badge ${item.displayStatusType === 'repair' ? 'maintenance' : ''}">${item.displayStatus || item.status}</span>
            </div>
        `).join('');
    }

    function addLoanItemRow() {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
            <div>
                <select class="loan-row-category" required></select>
                <p class="stock-note"></p>
            </div>
            <div>
                <select class="loan-item-select" required></select>
                <p class="stock-note"></p>
            </div>
            <input class="loan-item-qty" type="number" min="1" value="1" required>
            <button type="button" class="danger-btn" onclick="removeLoanItemRow(this)">删除</button>
        `;
        document.getElementById('loan-item-rows').appendChild(row);
        fillLoanCategorySelect(row.querySelector('.loan-row-category'));
        fillLoanSelect(row.querySelector('.loan-item-select'), row.querySelector('.loan-row-category').value);
        row.querySelector('.loan-row-category').addEventListener('change', () => {
            fillLoanSelect(row.querySelector('.loan-item-select'), row.querySelector('.loan-row-category').value);
            validateLoanInventory();
            updateLoanValidationSummary();
        });
        row.querySelector('.loan-item-select').addEventListener('change', () => {
            validateLoanInventory();
            updateLoanValidationSummary();
        });
        row.querySelector('.loan-item-qty').addEventListener('input', () => {
            validateLoanInventory();
            updateLoanValidationSummary();
        });
        validateLoanInventory();
        updateLoanValidationSummary();
    }

    function removeLoanItemRow(btn) {
        if (document.querySelectorAll('#loan-item-rows .item-row').length <= 1) return showLoanMessage('至少保留一项物资。', 'warning');
        btn.closest('.item-row').remove();
        validateLoanInventory();
        updateLoanValidationSummary();
    }

    function refreshLoanRows() {
        document.querySelectorAll('#loan-item-rows .item-row').forEach(row => {
            fillLoanCategorySelect(row.querySelector('.loan-row-category'));
            fillLoanSelect(row.querySelector('.loan-item-select'), row.querySelector('.loan-row-category').value);
        });
        validateLoanInventory();
    }

    function fillLoanCategorySelect(select) {
        const selected = select.value;
        const categories = [...new Set(loanInventory.map(item => item.category || '未分类'))];
        select.innerHTML = '<option value="">分类</option>' + categories.map(category =>
            `<option value="${escapeHtml(category)}" ${selected === category ? 'selected' : ''}>${escapeHtml(category)}</option>`
        ).join('');
    }

    function fillLoanSelect(select, category) {
        const selected = select.value;
        const normalItems = loanInventory.filter(item =>
            category && item.category === category && item.status !== '需要维修' && item.availableQuantity > 0
        );
        select.innerHTML = '<option value="">具体型号</option>' + normalItems.map(item =>
            `<option value="${item.id}" ${selected === item.id ? 'selected' : ''}>${escapeHtml(item.name)}（可用 ${item.availableQuantity}）</option>`
        ).join('');
        if (!normalItems.some(item => item.id === selected)) select.value = '';
    }

    function collectLoanItems() {
        return Array.from(document.querySelectorAll('#loan-item-rows .item-row')).map(row => ({
            category: row.querySelector('.loan-row-category').value,
            inventoryId: row.querySelector('.loan-item-select').value,
            quantity: Number(row.querySelector('.loan-item-qty').value)
        })).filter(item => item.inventoryId);
    }

    function validateLoanForm() {
        const errors = [];
        const name = document.getElementById('loan-borrower-name').value.trim();
        const phone = document.getElementById('loan-phone').value.trim();
        const startTime = document.getElementById('loan-start-time').value;
        const endTime = document.getElementById('loan-end-time').value;
        const pickupTime = document.getElementById('loan-pickup-time').value;
        const selectedItems = collectLoanItems();

        if (!/^[\u4e00-\u9fa5]{2,10}$/.test(name)) {
            errors.push('借用人姓名请填写 2-10 个中文字符。');
        }
        if (!/^1[3-9]\d{9}$/.test(phone)) {
            errors.push('联系电话请填写 11 位中国大陆手机号。');
        }
        if (!startTime || !endTime || !pickupTime) {
            errors.push('请完整填写借用时间、预计归还时间和前往借取时间。');
        } else {
            if (new Date(startTime) >= new Date(endTime)) {
                errors.push('预计归还时间必须晚于借用开始时间。');
            }
        }
        if (selectedItems.length === 0) {
            errors.push('请至少选择一项借用物资。');
        }

        document.querySelectorAll('#loan-item-rows .item-row').forEach((row, index) => {
            const category = row.querySelector('.loan-row-category').value;
            const id = row.querySelector('.loan-item-select').value;
            const qty = Number(row.querySelector('.loan-item-qty').value);
            const item = loanInventory.find(entry => entry.id === id);
            if (!category) errors.push(`第 ${index + 1} 行请选择设备分类。`);
            if (!id) errors.push(`第 ${index + 1} 行请选择具体型号。`);
            if (!Number.isInteger(qty) || qty <= 0) errors.push(`第 ${index + 1} 行数量必须是正整数。`);
            if (item && qty > item.availableQuantity) {
                errors.push(`${item.name} 当前可用 ${item.availableQuantity}，不能借用 ${qty}。`);
            }
        });

        return errors;
    }

    function validateLoanInventory() {
        const totals = {};
        let valid = true;
        document.querySelectorAll('#loan-item-rows .item-row').forEach(row => {
            const id = row.querySelector('.loan-item-select').value;
            const qty = Number(row.querySelector('.loan-item-qty').value);
            const note = row.querySelector('.stock-note');
            const item = loanInventory.find(entry => entry.id === id);
            if (!item) {
                note.textContent = '';
                return;
            }
            totals[id] = (totals[id] || 0) + qty;
            note.textContent = `当前剩余可用：${item.availableQuantity}`;
            note.style.color = '#7f8c8d';
            if (totals[id] > item.availableQuantity) {
                valid = false;
                note.textContent = `库存不足：本次已选择 ${totals[id]}，当前可用 ${item.availableQuantity}`;
                note.style.color = '#e74c3c';
            }
        });
        document.getElementById('loan-submit-btn').disabled = loanInventory.length === 0;
        checkLoanConflicts();
        return valid;
    }

    function updateLoanValidationSummary() {
        const errors = validateLoanForm();
        if (errors.length > 0) {
            showLoanMessage(errors.join('\n'), 'error');
        } else {
            const msg = document.getElementById('loan-message');
            if (msg.classList.contains('error')) {
                msg.className = 'status-message';
                msg.textContent = '';
            }
        }
    }

    async function checkLoanConflicts() {
        const startTime = document.getElementById('loan-start-time').value;
        const endTime = document.getElementById('loan-end-time').value;
        const items = collectLoanItems();
        if (!startTime || !endTime || items.length === 0) return;
        try {
            const res = await fetch('/api/loan/conflicts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ startTime, endTime, items })
            });
            const result = await parseLoanApiResponse(res);
            const blocking = (result.data || []).filter(item => item.availableDuringRequestedPeriod < item.requestedQuantity);
            if (blocking.length > 0) {
                showLoanMessage(blocking.map(item => `${item.name} 在该时段仅可用 ${item.availableDuringRequestedPeriod}`).join('；'), 'warning');
            }
        } catch (error) {
            console.warn(error);
        }
    }

    async function submitLoanApplication(event) {
        event.preventDefault();
        const formErrors = validateLoanForm();
        if (formErrors.length > 0) {
            showLoanMessage(formErrors.join('\n'), 'error');
            return;
        }
        if (!validateLoanInventory()) return showLoanMessage('请先修正库存不足的物资数量。', 'error');
        const payload = {
            borrowerName: document.getElementById('loan-borrower-name').value.trim(),
            phone: document.getElementById('loan-phone').value.trim(),
            startTime: document.getElementById('loan-start-time').value,
            endTime: document.getElementById('loan-end-time').value,
            pickupTime: document.getElementById('loan-pickup-time').value,
            note: document.getElementById('loan-note').value.trim(),
            items: collectLoanItems()
        };
        try {
            const btn = document.getElementById('loan-submit-btn');
            btn.disabled = true;
            btn.textContent = '提交中...';
            const res = await fetch('/api/loan/apply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await parseLoanApiResponse(res);
            if (!result.success) throw new Error(result.error);
            showLoanMessage(result.message, 'success');
            alert('借用申请提交成功，请等待管理员审核。');
            document.getElementById('loan-form').reset();
            document.getElementById('loan-item-rows').innerHTML = '';
            addLoanItemRow();
            await loadLoanInventory();
        } catch (error) {
            showLoanMessage(error.message, 'error');
        } finally {
            const btn = document.getElementById('loan-submit-btn');
            btn.disabled = false;
            btn.textContent = '提交借用申请';
            validateLoanInventory();
        }
    }

    function showLoanMessage(text, type) {
        const msg = document.getElementById('loan-message');
        msg.className = `status-message ${type}`;
        msg.textContent = text;
    }

    async function parseLoanApiResponse(res) {
        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
            const text = await res.text();
            const hint = text.trim().startsWith('<')
                ? '接口返回了 HTML 页面，请重启 Node 服务后再试。'
                : text.slice(0, 120);
            throw new Error(hint);
        }
        return res.json();
    }

    function escapeHtml(text) {
        return String(text || '').replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[char]));
    }
</script>
